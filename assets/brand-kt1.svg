<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3a64" />
      <stop offset="100%" stop-color="#08233d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d372" />
      <stop offset="50%" stop-color="#d49f2b" />
      <stop offset="100%" stop-color="#aa7916" />
    </linearGradient>
    <linearGradient id="torchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" />
      <stop offset="50%" stop-color="#f7b731" />
      <stop offset="100%" stop-color="#e15f41" />
    </linearGradient>
    <!-- Circular Text Path -->
    <path id="textCircleTop" d="M 60,250 A 190,190 0 1,1 440,250" fill="none" />
    <path id="textCircleBottom" d="M 440,250 A 190,190 0 0,1 60,250" fill="none" />
  </defs>

  <!-- Outer Ring with Gold Trim -->
  <circle cx="250" cy="250" r="240" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Circular Arch Text -->
  <text font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#f8fafc" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      SD NEGERI KARANG TENGAH 1
    </textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#f5d372" letter-spacing="4">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ KOTA TANGERANG ★
    </textPath>
  </text>

  <!-- Inner Shield -->
  <path d="M 250,95 C 330,95 365,115 365,195 C 365,285 295,355 250,385 C 205,355 135,285 135,195 C 135,115 170,95 250,95 Z" 
        fill="#0b2944" stroke="url(#goldGrad)" stroke-width="7" />
  <path d="M 250,110 C 318,110 348,128 348,195 C 348,272 288,335 250,364 C 212,335 152,272 152,195 C 152,128 182,110 250,110 Z" 
        fill="#14524b" opacity="0.9" />

  <!-- Star at Top of Shield -->
  <polygon points="250,120 256,138 274,138 260,149 265,167 250,156 235,167 240,149 226,138 244,138" fill="url(#goldGrad)" />

  <!-- Open Book Symbol (Pendidikan) -->
  <g transform="translate(250, 280)">
    <!-- Pages Left -->
    <path d="M 0,10 C -25,0 -60,5 -80,22 C -80,-20 -50,-25 0,-15 Z" fill="#ffffff" />
    <path d="M 0,20 C -25,10 -60,15 -80,32 C -80,-10 -50,-15 0,-5 Z" fill="#e2e8f0" />
    <!-- Pages Right -->
    <path d="M 0,10 C 25,0 60,5 80,22 C 80,-20 50,-25 0,-15 Z" fill="#ffffff" />
    <path d="M 0,20 C 25,10 60,15 80,32 C 80,-10 50,-15 0,-5 Z" fill="#e2e8f0" />
    <!-- Book Spine & Ribbon -->
    <path d="M -5,-15 L 0,-10 L 5,-15 L 3,35 L 0,38 L -3,35 Z" fill="url(#goldGrad)" />
    <!-- Lines on left page -->
    <line x1="-20" y1="-2" x2="-65" y2="10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-18" y1="8" x2="-62" y2="20" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Lines on right page -->
    <line x1="20" y1="-2" x2="65" y2="10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="18" y1="8" x2="62" y2="20" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Torch of Wisdom / Obor Ilmu -->
  <g transform="translate(250, 195)">
    <!-- Torch Flame -->
    <path d="M 0,-40 C 14,-26 20,-14 12,0 C 22,-8 18,-24 0,-40 Z" fill="url(#torchGrad)" />
    <path d="M 0,-40 C -14,-26 -20,-14 -12,0 C -22,-8 -18,-24 0,-40 Z" fill="url(#torchGrad)" />
    <path d="M 0,-34 C 8,-22 10,-12 0,4 C -10,-12 -8,-22 0,-34 Z" fill="#fff5cc" />
    <!-- Torch Handle & Bowl -->
    <path d="M -16,2 L 16,2 L 12,18 L -12,18 Z" fill="url(#goldGrad)" />
    <path d="M -8,18 L 8,18 L 5,50 L -5,50 Z" fill="url(#goldGrad)" stroke="#aa7916" stroke-width="1.5" />
    <circle cx="0" cy="52" r="5" fill="#f5d372" />
  </g>

  <!-- Banner at Bottom -->
  <g transform="translate(250, 420)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0b2944" stroke="url(#goldGrad)" stroke-width="3" />
    <text x="0" y="7" text-anchor="middle" font-family="'Plus Jakarta Sans', Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="2.5">
      NPSN 20607151
    </text>
  </g>
</svg>
