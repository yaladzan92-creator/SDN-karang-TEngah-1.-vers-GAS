<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#113e63" />
      <stop offset="60%" stop-color="#1b5a7e" />
      <stop offset="100%" stop-color="#2d779d" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b83824" />
      <stop offset="100%" stop-color="#8a2515" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfefe" />
      <stop offset="100%" stop-color="#e8f0f6" />
    </linearGradient>
    <linearGradient id="trimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#145a53" />
      <stop offset="100%" stop-color="#0f3d38" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d8e52" />
      <stop offset="100%" stop-color="#245d34" />
    </linearGradient>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2eaf1" />
      <stop offset="100%" stop-color="#c9d7e3" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="700" fill="url(#skyGrad)" />

  <!-- Distant Clouds & Sun -->
  <circle cx="1020" cy="140" r="70" fill="#fde047" opacity="0.25" />
  <circle cx="1020" cy="140" r="45" fill="#fef08a" opacity="0.5" />
  <path d="M 150,160 Q 190,130 240,150 Q 290,120 340,150 Q 370,180 330,190 Q 250,200 160,190 Z" fill="#ffffff" opacity="0.22" />
  <path d="M 850,210 Q 890,185 930,200 Q 970,175 1010,200 Q 1030,225 1000,235 Q 920,245 850,235 Z" fill="#ffffff" opacity="0.18" />

  <!-- Background Trees -->
  <ellipse cx="120" cy="450" rx="140" ry="110" fill="#1b4d32" opacity="0.8" />
  <ellipse cx="280" cy="460" rx="120" ry="90" fill="#1f5a3a" opacity="0.75" />
  <ellipse cx="940" cy="460" rx="150" ry="110" fill="#1b4d32" opacity="0.8" />
  <ellipse cx="1100" cy="450" rx="130" ry="100" fill="#1f5a3a" opacity="0.8" />

  <!-- School Main Building Base -->
  <g transform="translate(150, 260)">
    <!-- Central Main Building -->
    <!-- Roof Central -->
    <polygon points="450,0 200,110 700,110" fill="url(#roofGrad)" />
    <!-- Roof Wings -->
    <polygon points="200,110 50,110 0,160 250,160" fill="#a32f1d" />
    <polygon points="700,110 850,110 900,160 650,160" fill="#a32f1d" />

    <!-- Clock / Crest Tower -->
    <rect x="410" y="30" width="80" height="70" fill="#0d2e4e" rx="4" />
    <circle cx="450" cy="65" r="24" fill="#ffffff" stroke="#d49f2b" stroke-width="4" />
    <line x1="450" y1="65" x2="450" y2="52" stroke="#0d2e4e" stroke-width="3" stroke-linecap="round" />
    <line x1="450" y1="65" x2="460" y2="65" stroke="#0d2e4e" stroke-width="3" stroke-linecap="round" />

    <!-- Walls -->
    <rect x="220" y="110" width="460" height="230" fill="url(#wallGrad)" />
    <!-- Left Wing -->
    <rect x="0" y="160" width="220" height="180" fill="#f1f6f9" />
    <!-- Right Wing -->
    <rect x="680" y="160" width="220" height="180" fill="#f1f6f9" />

    <!-- School Signboard Header -->
    <rect x="250" y="125" width="400" height="38" rx="6" fill="url(#trimGrad)" stroke="#d49f2b" stroke-width="2" />
    <text x="450" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3">
      SD NEGERI KARANG TENGAH 1
    </text>

    <!-- Upper Windows Central -->
    <g fill="#93c5fd" stroke="#0e3a64" stroke-width="3">
      <rect x="260" y="180" width="48" height="60" rx="3" />
      <rect x="330" y="180" width="48" height="60" rx="3" />
      <rect x="520" y="180" width="48" height="60" rx="3" />
      <rect x="590" y="180" width="48" height="60" rx="3" />
      <!-- Wing Windows -->
      <rect x="30" y="190" width="45" height="55" rx="3" />
      <rect x="95" y="190" width="45" height="55" rx="3" />
      <rect x="160" y="190" width="45" height="55" rx="3" />
      <rect x="700" y="190" width="45" height="55" rx="3" />
      <rect x="765" y="190" width="45" height="55" rx="3" />
      <rect x="830" y="190" width="45" height="55" rx="3" />
    </g>

    <!-- Entrance Pillars & Door -->
    <rect x="400" y="180" width="100" height="160" fill="#145a53" />
    <!-- Pillars -->
    <rect x="390" y="175" width="18" height="165" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <rect x="492" y="175" width="18" height="165" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <!-- Glass Doors -->
    <rect x="415" y="250" width="32" height="90" fill="#7dd3fc" stroke="#0e3a64" stroke-width="2" />
    <rect x="453" y="250" width="32" height="90" fill="#7dd3fc" stroke="#0e3a64" stroke-width="2" />

    <!-- Ground Floor Corridor Pillars -->
    <g fill="#cbd5e1">
      <rect x="240" y="260" width="14" height="80" />
      <rect x="300" y="260" width="14" height="80" />
      <rect x="360" y="260" width="14" height="80" />
      <rect x="530" y="260" width="14" height="80" />
      <rect x="590" y="260" width="14" height="80" />
      <rect x="650" y="260" width="14" height="80" />
    </g>
  </g>

  <!-- Foreground Courtyard & Garden -->
  <polygon points="0,580 1200,580 1200,700 0,700" fill="url(#courtGrad)" />
  <polygon points="0,540 1200,540 1200,580 0,580" fill="url(#grassGrad)" />

  <!-- Flagpole with Indonesian Flag -->
  <g transform="translate(600, 360)">
    <!-- Base -->
    <polygon points="-25,220 25,220 18,205 -18,205" fill="#64748b" />
    <rect x="-16" y="195" width="32" height="12" fill="#94a3b8" />
    <!-- Pole -->
    <line x1="0" y1="200" x2="0" y2="0" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#d49f2b" />
    <!-- Flag (Merah Putih Waving) -->
    <g transform="translate(0, 10)">
      <path d="M 0,0 Q 40,-8 80,4 Q 120,16 150,5 L 150,45 Q 120,56 80,44 Q 40,32 0,40 Z" fill="#e11d48" />
      <path d="M 0,40 Q 40,32 80,44 Q 120,56 150,45 L 150,85 Q 120,96 80,84 Q 40,72 0,80 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    </g>
  </g>

  <!-- Foreground Trees & Flowerbeds -->
  <g fill="#245d34">
    <ellipse cx="60" cy="560" rx="45" ry="35" />
    <ellipse cx="120" cy="565" rx="40" ry="30" fill="#328047" />
    <ellipse cx="1080" cy="565" rx="45" ry="35" fill="#328047" />
    <ellipse cx="1140" cy="560" rx="40" ry="30" />
  </g>

  <!-- Clean Overlay Label in Bottom Corner -->
  <g transform="translate(40, 640)">
    <rect width="420" height="36" rx="10" fill="rgba(11,41,68,0.85)" stroke="rgba(255,255,255,0.2)" />
    <text x="210" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      Gedung &amp; Lingkungan Belajar SDN Karang Tengah 1
    </text>
  </g>
</svg>
